name: private-mode

image:
  repository:  # required
  pullPolicy: IfNotPresent
  pullSecrets: []
  tag:  # required

service:
  type: ClusterIP
  port: 3000

# supply your own service account if extra permissions are required, like secret access
serviceAccount:
  name:

env: private

githubPat: # required, or set via secret
githubHost: # optional, defaults to github.com. Set to your GHES hostname (e.g. github.acme.corp) for GHES deployments
privateModeKey: # required, or set via secret

replicaCount: 1

resources:
  limits:
    memory: 4Gi
  requests:
    memory: 256Mi

log: "INFO,sqlx::query=info,hyper=info"

nodeGroup:
# ex.
#  node_group: example

secretKeyRef:
  name:
secretsVolume:
# ex.
#  csi:
#    driver: secrets-store.csi.k8s.io
#    readOnly: true
#    volumeAttributes:
#      secretProviderClass: some_name

# it is recommended to use persistent storage when the size of repositories is large (5GB+)
storage:
  size:
  class:

extraEnv: {}

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
containerSecurityContext: {}
